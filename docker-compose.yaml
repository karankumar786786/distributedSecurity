

networks:
  app-network:
    driver: bridge

services:
  # ---------------- NETWORK ----------------
  # Docker automatically creates a bridge network

  # ---------------- REDPANDA ----------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.1
    command:
      - redpanda
      - start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    restart: always
    ports:
      - "8080:8080"
      - "19092:19092"
      - "18081:18081"

  # ---------------- REDIS STACK ----------------
  redis-stack:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: "--appendonly yes"
    restart: always
    volumes:
      - redis_data:/data

  # ---------------- SCYLLADB ----------------
  scylladb:
    image: scylladb/scylla:5.4
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --listen-address 0.0.0.0
      --rpc-address 0.0.0.0
      --broadcast-rpc-address 127.0.0.1
      --enable-cache 0
    restart: always
    ports:
      - "9042:9042"
      - "9180:9180"
    volumes:
      - scylla_data:/var/lib/scylla

  # ---------------- REDPANDA CONSOLE ----------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    restart: always
    depends_on:
      - redpanda
  mongo:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---------------- OBSERVABILITY STACK ----------------
  # Zipkin for distributed tracing
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network
    restart: always

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network
    restart: always

  # Loki for logs
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - app-network
    restart: always
    depends_on:
      - prometheus
      - loki
      - zipkin

volumes:
  redis_data:
  scylla_data:
  mongo_data:
  grafana-storage:
