# TEMPLATE: application.yaml observability configuration
# Add this to the end of each microservice's application.yaml

# OpenTelemetry - Traces to Zipkin
otel:
  service:
    name: ${spring.application.name}
  traces:
    exporter: zipkin
  exporter:
    otlp:
      enabled: false
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans
      enabled: true

# Actuator endpoints for Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# Logging with trace context
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id},%X{span_id}]"
