spring:
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      host: localhost
      port: 27017
      database: security
      username: admin
      password: secret
      authentication-database: admin
      auto-index-creation: true
  application:
    name: security
  cache:
    type: redis
  kafkaConfig:
    server:
      address: localhost:19092
    producer:
      topic: my-topic
    consumer:
      group-id: my-group
      stream-id: avro-stream
    schema:
      registry:
        url: http://localhost:18081
    topics:
      mail: mail-topic
      sms: sms-topic
      processed-mail: processed-mail-topic
      processed-sms: processed-sms-topic
      processed-security-event: processed-security-event-topic
      security-event: security-event-topic
    window:
      duration-ms: 60000
server:
  port: 10000
jwt:
  access:
    oldkeyId: "access-key-2025-12"
    newkeyId: "access-key-2026-01"
    oldkey: "old-access-secret-key-old-access-secret-key"
    newkey: "new-access-secret-key-new-access-secret-key"
  refresh:
    oldkeyId: "refresh-key-2025-12"
    newkeyId: "refresh-key-2026-01"
    oldkey: "old-refresh-secret-key-old-refresh-secret-key"
    newkey: "new-refresh-secret-key-new-refresh-secret-key"
  temp:
    oldkeyId: "temp-key-2025-12"
    newkeyId: "temp-key-2026-01"
    oldkey: "old-temp-secret-key-old-temp-secret-key"
    newkey: "new-temp-secret-key-new-temp-secret-key"
  issuer: "my-auth-service"
  accessExpiration: 60
  refreshExpiration: 60
  tempExpiration: 5
  recoveryExpiration: 15
hmac:
  oldkeyId: "hmac-key-2025-12"
  newkeyId: "hmac-key-2026-01"
  oldkey: "old-hmac-secret-key-old-hmac-secret-key"
  newkey: "new-hmac-secret-key-new-hmac-secret-key"
grpc:
  client:
    password-encoding-service:
      address: "static://localhost:9000"
      negotiation-type: plaintext
security:
  policy:
    max-login-attempts: 3
    lockout-duration-hours: 6
