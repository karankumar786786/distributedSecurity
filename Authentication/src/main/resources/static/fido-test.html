<!DOCTYPE html>
<html>
<head>
    <title>FIDO2 Security Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; max-width: 1200px; margin: 0 auto; color: #333; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fafafa; }
        h2 { margin-top: 0; color: #0056b3; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        h3 { color: #555; margin-top: 20px; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log-container { margin-top: 20px; }
        .log { background: #222; color: #0f0; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre-wrap; }
        .token-display { word-break: break-all; font-size: 11px; background: #e9ecef; padding: 5px; border-radius: 4px; margin-top: 5px; color: #555; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">🛡️ FIDO2 Security Dashboard</h1>

    <div class="container">
        
        <!-- PANEL 1: AUTHENTICATION -->
        <div class="panel">
            <h2>1. User Authentication</h2>
            
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" value="user">

            <button onclick="checkUser()">Check User Exist</button>
            <div id="checkUserResult" class="token-display hidden"></div>

            <h3>Password Login</h3>
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" value="password">
            <button onclick="loginPassword()">Login (Get Bearer Token)</button>
            
            <div id="bearerTokenDisplay" class="token-display hidden"></div>
        </div>

        <!-- PANEL 2: FIDO REGISTRATION -->
        <div class="panel">
            <h2>2. FIDO Registration</h2>
            <p>Requires <b>Bearer Token</b> from Step 1.</p>
            <button onclick="startFidoRegistration()">Register New Passkey</button>
        </div>

        <!-- PANEL 3: FIDO LOGIN -->
        <div class="panel">
            <h2>3. FIDO Login</h2>
            <p>Requires <b>Temp Token</b> from "Check User".</p>
            <button onclick="startFidoLogin()">Login with Passkey</button>
        </div>

    </div>

    <div class="log-container">
        <h3>System Log</h3>
        <button onclick="document.getElementById('statusLog').innerText='Ready...'" style="width: auto; padding: 5px 10px; margin-bottom: 5px; background: #6c757d;">Clear Log</button>
        <div id="statusLog" class="log">Ready...</div>
    </div>

    <script>
        const API_BASE = "http://localhost:10000/auth";
        let TEMP_TOKEN = "";
        let BEARER_TOKEN = "";

        function log(msg, type = 'info') {
            const el = document.getElementById('statusLog');
            const time = new Date().toLocaleTimeString();
            let prefix = `[${time}] `;
            if (type === 'error') prefix += "❌ ";
            if (type === 'success') prefix += "✅ ";
            if (type === 'info') prefix += "ℹ️ ";
            
            el.innerText += "\n" + prefix + msg;
            el.scrollTop = el.scrollHeight;
        }

        // --- STEP 1: CHECK USER & LOGIN ---

        async function checkUser() {
            const username = document.getElementById('username').value;
            if (!username) return alert("Enter username");

            log(`Checking user: ${username}...`);
            try {
                const res = await fetch(`${API_BASE}/check-user-exist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, reason: "LOGIN" })
                });
                const data = await res.json();
                
                if (data.exist) {
                    log("User exists.", "success");
                    if (data.token) {
                        TEMP_TOKEN = data.token;
                        document.getElementById('checkUserResult').innerText = "Temp Token: " + TEMP_TOKEN.substring(0, 20) + "...";
                        document.getElementById('checkUserResult').classList.remove('hidden');
                        log("Captured X-Temp-Token for FIDO Login.");
                    }
                } else {
                    log("User does not exist.", "error");
                }
            } catch (e) { log("Error checking user: " + e.message, "error"); }
        }

        async function loginPassword() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!TEMP_TOKEN) {
                log("Missing Temp Token. Running Check User first...", "info");
                await checkUser();
                if(!TEMP_TOKEN) return;
            }

            log("Attempting Password Login...");
            try {
                const res = await fetch(`${API_BASE}/login/password`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Temp-Token': TEMP_TOKEN
                    },
                    body: JSON.stringify({ credential: password })
                });

                if (res.ok) {
                    const data = await res.json();
                    BEARER_TOKEN = data.accessToken;
                    document.getElementById('bearerTokenDisplay').innerText = "Bearer: " + BEARER_TOKEN.substring(0, 20) + "...";
                    document.getElementById('bearerTokenDisplay').classList.remove('hidden');
                    log("Login Successful! Bearer Token acquired.", "success");
                } else {
                    log("Login Failed: " + await res.text(), "error");
                }
            } catch (e) { log("Login Error: " + e.message, "error"); }
        }


        // Helper to convert ArrayBuffer to Base64URL string
        const bufToBase64url = (buf) => {
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        };

        // --- STEP 2: FIDO REGISTRATION ---

        async function startFidoRegistration() {
            if (!BEARER_TOKEN) return alert("Please Login (Step 1) to get a Bearer Token first.");
            
            log("--- STARTING FIDO REGISTRATION ---");
            try {
                // 1. INIT
                log("1. Init Registration...");
                const initRes = await fetch(`${API_BASE}/fido/register/init`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${BEARER_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({}) 
                });
                if (!initRes.ok) throw new Error(await initRes.text());
                
                const initData = await initRes.json();
                const options = JSON.parse(initData.options);

                // 2. HARDWARE INTERACTION
                const b64ToBuf = (b) => Uint8Array.from(atob(b.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                options.publicKey.challenge = b64ToBuf(options.publicKey.challenge);
                options.publicKey.user.id = b64ToBuf(options.publicKey.user.id);

                log("2. Waiting for Authenticator (Touch ID / Key)...");
                const credential = await navigator.credentials.create({ publicKey: options.publicKey });
                log("Authenticator response received.");

                // 3. COMPLETE
                const responsePayload = {
                    response: JSON.stringify({
                        id: credential.id,
                        rawId: bufToBase64url(credential.rawId),
                        type: credential.type,
                        response: {
                            attestationObject: bufToBase64url(credential.response.attestationObject),
                            clientDataJSON: bufToBase64url(credential.response.clientDataJSON)
                        },
                        clientExtensionResults: credential.getClientExtensionResults()
                    })
                };

                log("3. Completing Registration...");
                const completeRes = await fetch(`${API_BASE}/fido/register/complete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${BEARER_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(responsePayload)
                });

                if (completeRes.ok) {
                    log("FIDO Key Registered Successfully!", "success");
                } else {
                    throw new Error(await completeRes.text());
                }

            } catch (err) {
                log("Registration Failed: " + err.message, "error");
                console.error(err);
            }
        }


        // --- STEP 3: FIDO LOGIN ---

        async function startFidoLogin() {
            // Need Temp Token (refreshed preferably)
            if (!TEMP_TOKEN) {
                log("Missing Temp Token. Please click 'Check User Exist' first.", "error"); 
                return;
            }

            log("--- STARTING FIDO LOGIN ---");
            try {
                // 1. INIT
                log("1. Init Login...");
                const initRes = await fetch(`${API_BASE}/login/fido/init`, {
                    method: 'POST',
                    headers: { 'X-Temp-Token': TEMP_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                if (!initRes.ok) throw new Error(await initRes.text());
                const initData = await initRes.json();
                const options = JSON.parse(initData.options);

                // 2. HARDWARE INTERACTION
                const b64ToBuf = (b) => Uint8Array.from(atob(b.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                options.publicKey.challenge = b64ToBuf(options.publicKey.challenge);
                options.publicKey.allowCredentials.forEach(c => c.id = b64ToBuf(c.id));

                log("2. Waiting for Authenticator (Touch ID / Key)...");
                const assertion = await navigator.credentials.get({ publicKey: options.publicKey });
                log("Authenticator assertion received.");

                // 3. COMPLETE
                const responsePayload = {
                    response: JSON.stringify({
                        id: assertion.id,
                        rawId: bufToBase64url(assertion.rawId),
                        type: assertion.type,
                        response: {
                            authenticatorData: bufToBase64url(assertion.response.authenticatorData),
                            clientDataJSON: bufToBase64url(assertion.response.clientDataJSON),
                            signature: bufToBase64url(assertion.response.signature),
                            userHandle: assertion.response.userHandle ? bufToBase64url(assertion.response.userHandle) : null
                        },
                        clientExtensionResults: assertion.getClientExtensionResults()
                    })
                };

                log("3. Completing Login...");
                const completeRes = await fetch(`${API_BASE}/login/fido/complete`, {
                    method: 'POST',
                    headers: { 'X-Temp-Token': TEMP_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify(responsePayload)
                });

                if (completeRes.ok) {
                    const data = await completeRes.json();
                    BEARER_TOKEN = data.accessToken; // Start session
                    log("FIDO Login Successful! New Bearer Token acquired.", "success");
                    document.getElementById('bearerTokenDisplay').innerText = "Bearer: " + BEARER_TOKEN.substring(0, 20) + "...";
                } else {
                    throw new Error(await completeRes.text());
                }

            } catch (err) {
                log("FIDO Login Failed: " + err.message, "error");
                console.error(err);
            }
        }

    </script>
</body>
</html>
