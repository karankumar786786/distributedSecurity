apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
  namespace: distributed-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: authentication
    spec:
      containers:
      - name: authentication
        image: authentication:latest # Replace with actual image
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 10000
        envFrom:
        - configMapRef:
            name: common-config
        env:
        - name: SPRING_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: HMAC_NEW_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: HMAC_NEW_KEY
        - name: GRPC_CLIENT_PASSWORD_ENCODING_SERVICE_ADDRESS
          value: "static://password-encoding:9000"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapRef:
              name: common-config
              key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: authentication
  namespace: distributed-security
spec:
  selector:
    app: authentication
  ports:
  - protocol: TCP
    port: 10000
    targetPort: 10000
