apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-stream-processor
  namespace: distributed-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-stream-processor
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: sms-stream-processor
    spec:
      containers:
      - name: sms-stream-processor
        image: sms-stream-processor:latest # Replace with actual image
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: common-config
        env:
        - name: JWT_PROCESSOR_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_PROCESSOR_SECRET
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapRef:
              name: common-config
              key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: sms-stream-processor
  namespace: distributed-security
spec:
  selector:
    app: sms-stream-processor
  ports:
  - protocol: TCP
    port: 10010
    targetPort: 10010
