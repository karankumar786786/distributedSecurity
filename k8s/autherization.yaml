apiVersion: apps/v1
kind: Deployment
metadata:
  name: autherization
  namespace: distributed-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autherization
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: autherization
    spec:
      containers:
      - name: autherization
        image: autherization:latest # Replace with actual image
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 12000
        envFrom:
        - configMapRef:
            name: common-config
        env:
        - name: SPRING_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_AUTH_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: HMAC_NEW_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: HMAC_NEW_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: autherization
  namespace: distributed-security
spec:
  selector:
    app: autherization
  ports:
  - protocol: TCP
    port: 12000
    targetPort: 12000
