global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'host.docker.internal:10000' # Authentication
        - 'host.docker.internal:8082'  # Resource
        # Add other service ports here as I discover them from application.yaml files
        # Based on previous reads:
        # Authentication: 10000
        # Resource: 8082
        # passwordEncoding: 9000 (gRPC? might need different scraping or checking if it has web port)
        # Others seemed to not have specific server.port set, so they default to 8080.
        # This will be a problem if multiple services run on 8080 locally.
        # I need to verify ports for all services.
